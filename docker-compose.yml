services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: incident_dash
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: incident_dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_dash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
